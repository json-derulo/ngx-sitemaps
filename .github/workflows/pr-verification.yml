name: PR Verification

on:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install pnpm and Node.js
              uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
              with:
                  runtime: node@26
                  cache: true

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Check Code Style
              run: pnpm check-code-style
