name: PR Verification

on:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install pnpm and Node.js
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
              with:
                  runtime: node@24
                  cache: true

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Check Code Style
              run: pnpm check-code-style
