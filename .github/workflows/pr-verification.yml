name: PR Verification

on:
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Install pnpm and Node.js
              uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2
              with:
                  runtime: node@24
                  cache: true

            - name: Build
              run: pnpm build

            - name: Test
              run: pnpm test
